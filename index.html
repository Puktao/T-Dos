<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151E28" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="F-Do’s">
<title>F-Do’s</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://tkfyiunfcclwczvpbdha.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app shell — sticky header, one scrolling screen per tab, fixed bottom tab bar. Open jobs are blue, finished jobs green; red is for warnings and delete; everything else is ink on cool grey. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#142030; --muted:#5B6779; --line:#D3D9E1;
  --acil:#C8322A; --acil-ink:#9E211B;
  --orta:#E2A700; --orta-soft:#FFF3CC; --orta-ink:#7A5800;
  --sureli:#2563C4; --sureli-soft:#E2EBFA;
  --ok:#2B7A4B; --ok-soft:#E0F0E6;
  --scrim:rgba(14,20,28,.5); --shadow:0 2px 6px rgba(20,32,48,.10),0 10px 28px rgba(20,32,48,.14);
  --font-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151E28; --surface-2:#1B2532; --ink:#E6EBF1; --muted:#98A3B2; --line:#2A3544;
  --acil:#F0695E; --acil-ink:#FF9B92;
  --orta:#F2C94C; --orta-soft:#382D0C; --orta-ink:#F5D36E;
  --sureli:#5B95F0; --sureli-soft:#18284A;
  --ok:#78C895; --ok-soft:#163222;
  --scrim:rgba(0,0,0,.6); --shadow:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E28; --surface-2:#1B2532; --ink:#E6EBF1; --muted:#98A3B2; --line:#2A3544;
  --acil:#F0695E; --acil-ink:#FF9B92;
  --orta:#F2C94C; --orta-soft:#382D0C; --orta-ink:#F5D36E;
  --sureli:#5B95F0; --sureli-soft:#18284A;
  --ok:#78C895; --ok-soft:#163222;
  --scrim:rgba(0,0,0,.6); --shadow:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:720px;margin:0 auto}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .col{display:flex;align-items:center;gap:8px;padding-block:10px}
.hdr h1{margin:0;font:800 21px/1 var(--font-display);letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sp{flex:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* logo: uygulama ikonuyla aynı çizim, her iki temada lacivert kutu */
.brand{flex:none;display:block;background:#142030;border-radius:9px;padding:4px 8px;box-shadow:inset 0 0 0 1px var(--line)}
.brand svg{display:block;height:28px;width:auto;aspect-ratio:249/112}
.iconbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;max-width:96px;min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font:600 11px var(--font-mono);color:var(--muted)}

.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--orta-soft);color:var(--ink);border:1px solid var(--orta);font-size:13.5px}

/* screens */
.screen{padding-block:14px 8px}


/* department groups */
.none{font-size:13.5px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.card.open{--c:var(--sureli);--cs:var(--sureli-soft)}   /* yapılacaklar: mavi */
.card.done{--c:var(--ok);--cs:var(--ok-soft)}            /* tamamlananlar: yeşil */
.card.open,.card.done{background:var(--cs);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card .plate{background:var(--surface)}
.card.fresh{animation:fresh 2.4s ease-out}
/* sola kaydırınca silme */
.swc{position:relative;border-radius:12px;overflow:hidden;touch-action:pan-y}
.swc .card{transition:transform .2s ease;position:relative;z-index:1}
.swc-act{position:absolute;inset:0 0 0 auto;width:96px;display:flex;background:var(--acil);border-radius:12px}
.swc-del{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.swc-del.armed{background:var(--acil-ink)}
@keyframes fresh{0%{box-shadow:0 0 0 4px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.plate{width:60px;min-height:62px;border:1.5px solid var(--ink);background:var(--surface-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 3px;text-align:center}
.plate small{font:600 9px/1 var(--font-mono);letter-spacing:.14em;color:var(--muted)}
.plate b{font:800 27px/.95 var(--font-display);font-variant-numeric:tabular-nums}
.plate b.long{font-size:15px;line-height:1.05;overflow-wrap:anywhere}
.body{min-width:0;display:flex;flex-direction:column;gap:5px}
.r1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.kind{font-weight:600;font-size:14.5px;line-height:1.3}
.kind em{font-style:normal;color:var(--muted);font-weight:500}

/* home: two hero boxes + sections */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbox{border-radius:18px;padding:14px 14px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
/* açık gri kutu, solda koyu çentik (kartlardaki gibi) */
.hbox.today{position:relative;overflow:hidden;padding-left:19px;background:color-mix(in srgb,var(--muted) 30%,var(--surface));border-color:color-mix(in srgb,var(--muted) 45%,var(--surface));color:var(--ink)}
.hbox.today::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--ink)}
/* "Bitmemiş işler": solda açık gri çentik */
.hbox.open{position:relative;overflow:hidden;padding-left:19px}
.hbox.open::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:color-mix(in srgb,var(--muted) 45%,var(--surface))}
.hbox .hl{font-weight:700;font-size:14.5px;line-height:1.25}
.hbox b{font:800 64px/.9 var(--font-display);font-variant-numeric:tabular-nums;margin-top:auto}
.hbox .hs{font-size:12.5px;line-height:1.35;opacity:.8}
.sec{margin-top:24px}
.sech{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sech h3{margin:0;font:800 23px/1.1 var(--font-display);letter-spacing:.01em}
.cnt{font:600 12px var(--font-mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.more{margin-left:auto;border:0;background:none;padding:4px 0;font-weight:600;font-size:13.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.desc{margin:0;font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.due{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.due svg{flex:none;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.dept{font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink)}
.st{font-weight:600}
.flag{font:600 10px/1.6 var(--font-mono);letter-spacing:.05em;border:1px solid currentColor;border-radius:3px;padding:0 5px}
.flag.ooo{color:var(--acil-ink)} .flag.ok{color:var(--ok)} .flag.rep{color:var(--ink)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.card .by{align-self:flex-end;font-size:11.5px;color:var(--muted);text-align:right;margin-top:-2px}   /* açık işte sağ altta bildirenin adı */
.meta .reopen{margin-left:auto;padding:6px 11px;font-size:13px}   /* "Yeniden aç": Tamamlandı yazısıyla aynı satırda, en sağda */
.card.done .actions{justify-content:flex-end}   /* "Kontrol edildi" sağda, "Yeniden aç"ın altında */
.card.done .actions [data-act="verify"]{padding:6px 11px;font-size:13px}
.card.done.verified{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.btn{font-weight:600;font-size:13.5px;border-radius:9px;padding:8px 13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;line-height:1.2}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--acil-ink);border-color:var(--acil);background:transparent}
.btn.danger.armed{background:var(--acil);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

/* filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search input{width:100%;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

/* list toolbar: search + filter button */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:5;background:var(--bg);display:flex;gap:8px;padding-block:8px;margin-top:-8px}
.sbox{flex:1;min-width:0;position:relative}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox input{width:100%;height:46px;font:inherit;font-size:16px;padding:0 40px 0 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox input:focus{border-color:var(--ink);outline:none}
.sbox .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);border-radius:50%;width:28px;height:28px;font-size:12px;cursor:pointer;color:var(--muted)}
.fbtn{flex:none;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn .n{font:600 11px/18px var(--font-mono);min-width:18px;height:18px;border-radius:9px;background:var(--bg);color:var(--ink);text-align:center;padding:0 5px}
@media (max-width:360px){.fbtn span:not(.n){display:none}}
.active{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:1px}
.active::-webkit-scrollbar{display:none}
.achip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.achip .x{width:18px;height:18px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:10px}
.achip.clear{border-color:var(--line);color:var(--muted);padding-right:11px}
.resmeta{margin:2px 0 10px}

/* form selects */
.sel{position:relative;min-width:0}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer;text-overflow:ellipsis}
.sel select:disabled,.field input:disabled{opacity:.45;cursor:not-allowed}
.sel select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,128px);gap:8px}
.clist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.clist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.clist li:last-child{border-bottom:0}
.clist .ci{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.clist .ci input{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none;cursor:pointer}
.clist .t{flex:1;min-width:0;overflow-wrap:anywhere}
.clist li.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.clist .rm{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.clist .rm:hover{background:var(--surface-2)}
.cprog{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.cbar{flex:1;max-width:130px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}
.cbar div{height:100%;background:var(--ok);border-radius:3px}
.check input:disabled + span{opacity:.45}
.section-t .muted{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0;margin-left:6px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* son tarih: diğer alanlarla aynı genişlikte (yarım satır) */
.pair .field{min-width:0}
.pair .sel select{padding-right:32px}
.pair .sel::after{right:13px}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;font:800 22px/1.1 var(--font-display);color:var(--ink);text-wrap:balance}
.empty p{margin:0 auto;max-width:42ch;font-size:14px}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:800 26px/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.panel h3{margin:0 0 10px;font:800 19px/1.1 var(--font-display);letter-spacing:.01em}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.dtable th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:0 0 6px 6px}
.dtable th:first-child,.dtable td:first-child{text-align:left;padding-left:0}
/* tablo başlık satırı: Anasayfa'daki "Bugün yapılacaklar" kutusunun açık grisi */
.dtable thead th{background:color-mix(in srgb,var(--muted) 30%,var(--surface));color:var(--ink);padding:7px 0 7px 6px;white-space:nowrap}
.dtable thead th:first-child{padding-left:8px}
.dtable thead th:last-child{padding-right:8px}
.dtable td:first-child{padding-left:8px}
.dtable td:last-child{padding-right:8px}
.dtable td{text-align:right;padding:8px 0 8px 6px;border-top:1px solid var(--line)}
.tscroll{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px}
.bar .tr{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .tr div{height:100%;background:var(--ink);border-radius:4px}
.bar b{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .col{display:grid;grid-template-columns:repeat(4,1fr)}
.tb{border:0;background:none;padding:10px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tb svg{width:28px;height:28px}
@media (max-width:380px){.tb{font-size:11.5px}}   /* dar telefonda "Tamamlananlar" sığsın */
.tb[aria-current="page"]{color:var(--ink)}
.tb[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.tb .bd{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acil);color:#fff;font:600 11px/18px var(--font-mono);text-align:center}

.fab{position:fixed;z-index:31;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
@media (min-width:760px){.fab{right:calc(50% - 360px + 16px)}}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);width:max-content}

/* sheets */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:600px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;
  padding-top:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
/* alttan gelen ekranlar aşağıdan yukarı kayarak açılır */
.overlay:not([hidden]){animation:scrimIn .22s ease-out}
.overlay:not([hidden]) > .sheet{animation:sheetUp .3s cubic-bezier(.2,.8,.25,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scrimIn{from{background-color:transparent}}
@media (min-width:720px){.overlay:not([hidden]) > .sheet{animation:sheetPop .22s ease-out}}
@keyframes sheetPop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.overlay:not([hidden]),.overlay:not([hidden]) > .sheet{animation:none}}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (min-width:720px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:90%}.sheet::before{display:none}}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{margin:0;font:800 26px/1.05 var(--font-display);text-wrap:balance}
.sheet-head .x{margin-left:auto}
.sheet-head .hact{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.sheet-head .hact .x{margin-left:0}
.sheet-head .hact .btn{height:38px}
/* detay başlığı ekranın tepesine sabit; renkli çentik başlığın üst kenarında (kaydırırken kayma olmasın diye negatif konum yok) */
#detail{padding-top:0;overscroll-behavior:contain}
#detail::before{display:none}
#detail .sheet-head{position:sticky;top:0;z-index:3;margin:0 -18px;padding:20px 18px 12px}
.sheet-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.field input[type=text],.field textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--ink)}
.check small{display:block;color:var(--muted);font-size:12.5px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.err{color:var(--acil-ink);font-size:13px;margin:8px 0 0}
.dupwarn{margin:8px 0 0;padding:10px 12px;border:1px solid var(--orta);border-left-width:4px;border-radius:6px;font-size:13px;line-height:1.45;background:color-mix(in srgb,var(--orta) 12%,transparent)}
.dupwarn b{font-weight:700}
.field input.bad{border-color:var(--acil);box-shadow:0 0 0 2px color-mix(in srgb,var(--acil) 25%,transparent)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.facts dd{margin:0;overflow-wrap:anywhere}
/* iş detayı kartı: Departman, Son tarih, Açıklama, Liste, Durum; sağ altta Bildiren ve Açılış */
/* iş detayı: ekran zemini aciliyet kutularının rengiyle aynı; kartlardaki soldaki renkli çentik burada tepede */
#detail.open{--c:var(--sureli);--cs:var(--sureli-soft)} #detail.done{--c:var(--ok);--cs:var(--ok-soft)}
#detail{background:var(--cs,var(--surface))}
#detail .sheet-head{background:var(--cs,var(--surface));box-shadow:inset 0 6px 0 var(--c,var(--line)),0 1px 0 color-mix(in srgb,var(--c,var(--line)) 35%,var(--line))}
.dcard{display:block;cursor:default;margin-top:12px;padding:0;background:none!important;border:0!important;border-radius:0;overflow:visible}
.dcard::before{display:none}
.dcard .dc-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;font-size:14.5px}
.dcard .dc-row .k{color:var(--muted);font-size:12.5px;font-weight:600}
.dcard .dc-row .v{min-width:0;overflow-wrap:anywhere}
.dcard .dc-row .sel select{padding-block:8px}
.dcard .ddesc{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.dcard .section-t{margin-top:14px;font-size:16px}
.dcard .clist li{border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.dcard .dc-foot{margin-top:12px;text-align:right;font-size:11.5px;line-height:1.45;color:var(--muted)}
.ddesc{margin:14px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.log{list-style:none;margin:8px 0 0;padding:0 0 0 12px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line)}
.log li{font-size:13.5px}
.log .by{font-weight:700;color:var(--ink)}
.log time{display:block;font:500 11.5px var(--font-mono);color:var(--muted)}
.section-t{margin:22px 0 0;font:800 18px var(--font-display);letter-spacing:.02em}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* standalone shell */
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.field input[type=email],.field input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.overlay.login{background:var(--bg);align-items:center;padding:16px;z-index:70}
.overlay.login .sheet{border-radius:18px;max-width:420px;box-shadow:var(--shadow)}
.overlay.login .sheet::before{display:none}
.login-brand{display:flex;justify-content:center;margin:6px 0 14px}
.login-brand .brand{padding:12px 16px;border-radius:14px}
.login-brand .brand svg{height:54px}
.login-t{margin:0;font:800 28px/1.1 var(--font-display)}
.err.ok{color:var(--ok)}
/* kullanıcılar (yönetici) */
.ulist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ulist .uitem{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ulist .uact{position:absolute;inset:0 0 0 auto;width:168px;display:flex}
.ulist .ua{flex:1;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.ulist .ua.edit{background:var(--sureli)}
.ulist .ua.del{background:var(--acil)}
.ulist .ua.del.armed{background:var(--acil-ink)}
.ulist .ua:only-child{flex:0 0 100%}
.ulist .ufront{position:relative;background:var(--surface);padding:12px 14px;transition:transform .2s ease;cursor:pointer}
.ulist .uh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ulist .uh b{font-size:15.5px}
.ulist .um{display:flex;justify-content:space-between;gap:10px;margin-top:3px;font-size:13px;color:var(--muted)}
.ulist .um span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ulist .um .ud{flex:none;font-weight:600;color:var(--ink)}
.ulist .badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--orta-soft);color:var(--orta-ink)}
</style>

function beep(){
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, .22].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 988;
      g.gain.setValueAtTime(.0001, t0 + off); g.gain.exponentialRampToValueAtTime(.25, t0 + off + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + off + .18);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + off); o.stop(t0 + off + .2);
    });
  } catch(e){}
}
$("#soundBtn").addEventListener("click", () => {

  if (on){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){} beep(); toast(tx("sound.on")); }
  else { audioCtx = null; toast(tx("sound.off")); }
});

const REPEAT_DAYS = 30;

function screenReport(){

}

// Aynı yer + aynı tür/kategori için son 30 günde 2 ve üstü iş.
function repeats(list){
  const from = Date.now() - REPEAT_DAYS * 86400000, m = new Map();
  list.forEach(t => { if (!t.room || !t.cat || (t.createdAt || 0) < from) return;
    const k = t.room + "\u0000" + t.type + "\u0000" + t.cat; m.set(k, (m.get(k) || 0) + 1); });
  const arr = [...m.entries()].filter(x => x[1] > 1).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (!arr.length) return `<p class="muted" style="margin:0">${tx("rp.noRepeat")}</p>`;
  const max = arr[0][1];
  return `<div class="bars">${arr.map(([k, c]) => { const [room, type, cat] = k.split("\u0000");
    return `<div class="bar"><span>${esc(placeOf(room))} · ${esc(cL(cat))}</span><b>${c}</b><div class="tr"><div style="width:${c / max * 100}%"></div></div></div>`; }).join("")}</div>
    <p class="muted" style="margin:8px 0 0">${tx("rp.repeatNote")}</p>`;
}
function peoplePanel(created, done, open){
  const same = (a, b) => a && b && lower(a) === lower(b);
  const names = new Map();
  profiles.forEach(p => names.set(lower(p.name), {name: p.name, dept: p.dept}));
  const finisher = t => t.doneBy;
  [...created, ...done].forEach(t => [t.createdBy, finisher(t)].forEach(n => { if (n && !names.has(lower(n))) names.set(lower(n), {name: n, dept: null}); }));
  const rows = [...names.values()].map(p => {
    const c = created.filter(t => same(t.createdBy, p.name)).length;
    const d = done.filter(t => same(finisher(t), p.name)).length;
    return {p, c, d};
  }).filter(r => r.c || r.d || profiles.some(x => x.name === r.p.name))
    .sort((a, b) => (b.d + b.c) - (a.d + a.c) || a.p.name.localeCompare(b.p.name, "tr"));
  const body = rows.map(r => `<tr><td>${esc(r.p.name)}<br><small class="muted">${esc(dL(r.p.dept) || "—")}</small></td><td>${r.c}</td><td>${r.d}</td></tr>`).join("");
  return `<div class="panel"><h3>${tx("rp.people")}</h3><div class="tscroll"><table class="dtable">
      <thead><tr><th>${tx("rp.person")}</th><th>${tx("rp.opened")}</th><th>${tx("rp.finished")}</th></tr></thead>
      <tbody>${body || `<tr><td colspan="3">${tx("rp.noRec")}</td></tr>`}</tbody></table></div>
      <p class="muted" style="margin:8px 0 0">${tx("rp.peopleNote")}</p></div>`;
}

const CSW = 96;
function cardSwipeClose(){ document.querySelectorAll("#screen .swc.open").forEach(w => { w.classList.remove("open"); w.querySelector(".card").style.transform = ""; }); if (delArmed){ delArmed = null; renderScreen(); } }
function cardSwipeOpen(id){ const w = document.querySelector(`#screen .swc[data-sid="${CSS.escape(id)}"]`); if (!w) return; w.classList.add("open"); w.querySelector(".card").style.transform = `translateX(${-CSW}px)`; }
let csw = null;
$("#screen").addEventListener("pointerdown", e => {
  const w = e.target.closest(".swc"); if (!w || e.target.closest(".swc-act, .btn")) return;
  csw = {w, x: e.clientX, y: e.clientY, base: w.classList.contains("open") ? -CSW : 0, dx: 0, lock: null};
});
$("#screen").addEventListener("pointermove", e => {
  if (!csw) return;
  const dx = e.clientX - csw.x, dy = e.clientY - csw.y;
  if (csw.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) csw.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (csw.lock !== "x") return;
  csw.dx = dx; csw.w._moved = true;
  const c = csw.w.querySelector(".card"); c.style.transition = "none"; c.style.transform = `translateX(${Math.max(-CSW, Math.min(0, csw.base + dx))}px)`;
});
const cswEnd = () => {
  if (!csw) return;
  const c = csw.w.querySelector(".card"); c.style.transition = "";
  if (csw.lock === "x"){ const open = csw.base + csw.dx < -CSW / 2, id = csw.w.dataset.sid; document.querySelectorAll("#screen .swc.open").forEach(w => { if (w !== csw.w){ w.classList.remove("open"); w.querySelector(".card").style.transform = ""; } }); if (open) cardSwipeOpen(id); else { csw.w.classList.remove("open"); c.style.transform = ""; } }
  csw = null;
};
$("#screen").addEventListener("pointerup", cswEnd);
$("#screen").addEventListener("pointercancel", cswEnd);
$("#screen").addEventListener("click", e => {

    const id = cd.dataset.cdel, t = tasks.get(id); if (!t || !canDelete(t)) return;
    if (delArmed !== id){ delArmed = id; renderScreen(); cardSwipeOpen(id); return; }
    delArmed = null; requireMe(() => remove(id)); return;
  }
  const sw0 = e.target.closest(".swc");
  if (sw0 && sw0._moved){ sw0._moved = false; return; }
  if (sw0 && sw0.classList.contains("open")){ cardSwipeClose(); return; }
  const j = e.target.closest("[data-jump]");
  if (j){
    ui.tab = "yapilacak"; ui.todo = {...DEF.todo};
    const v = j.dataset.jump;
    if (v === "yeni") ui.todo.status = "yeni";
    window.scrollTo(0, 0); renderAll(); return;
  }
  const f = e.target.closest("[data-f]");
  if (f){ if (f.dataset.f === "rep") ui.rep = f.dataset.v; renderScreen(); return; }
  if (e.target.closest("#fOpen")){ openFilter(listKind()); return; }
  if (e.target.closest("#qClr")){ ui[listKind()].q = ""; renderScreen(); $("#q")?.focus(); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm){
    const k = listKind(), key = rm.dataset.rm;
    if (key === "__all") clearFilters(k);
    else if (key === "__everything") clearFilters(k, false);
    else ui[k][key] = "all";
    renderScreen(); return;
  }
  const c = e.target.closest(".card"); if (!c) return;
  const id = c.dataset.id, t = tasks.get(id); if (!t) return;
  const b = e.target.closest("[data-act]");

  requireMe(() => {
    if (a === "done"){
      if (openItems(t)){ toast(tx("t.itemsFirst", {n: openItems(t)})); openDetail(id); return; }
      patch(id, {status: "tamam", doneAt: Date.now(), doneBy: me.name}, "Tamamlandı olarak işaretledi");
    }
    if (a === "verify") patch(id, {verified: true, verifiedBy: who(), ooo: false}, t.ooo ? "Kontrol etti, oda satışa açıldı" : "Kontrol etti");
    if (a === "reopen"){
      // yeniden açılan işte listedeki onaylar da kalkar
      const items = (t.items || []).map(x => ({...x, done: false, by: null, at: null}));
      patch(id, {status: "yeni", doneAt: null, doneBy: null, verified: false, verifiedBy: null, ...(items.length ? {items} : {})}, "Yeniden açtı" + (items.length ? ", liste onayları kaldırıldı" : ""));
    }
  });
});

  try {
    const q = (t, cols) => sb.from(t).select(cols).order("sira").order("ad");
    const [d, ty, c, a] = await Promise.all([
      q("fdos_departmanlar", "kod,ad,kisa_ad,rozet,alan_gerekli,aktif"),
      q("fdos_turler", "kod,ad,departman,aktif"),
      q("fdos_kategoriler", "tur,ad,aktif"),
      q("fdos_alanlar", "ad,aktif")
    ]);
    if (d.error || ty.error || c.error || a.error || !(d.data || []).length || !(ty.data || []).length) return;
    Object.keys(DEPTS).forEach(k => delete DEPTS[k]);
    d.data.forEach(r => DEPTS[r.kod] = {label: r.ad, short: r.rozet, name: r.kisa_ad, noArea: !r.alan_gerekli, active: r.aktif});
    Object.keys(TYPES).forEach(k => delete TYPES[k]);
    ty.data.forEach(r => TYPES[r.kod] = {label: r.ad, dept: r.departman, active: r.aktif, cats: []});
    (c.data || []).forEach(r => { if (r.aktif && TYPES[r.tur]) TYPES[r.tur].cats.push(r.ad); });
    AREAS.length = 0; (a.data || []).forEach(r => { if (r.aktif) AREAS.push(r.ad); });
    renderAll(); saveSnap();
  } catch(e){}
}

    const {data, error} = await sb.from("fdos_profiles").select("user_id,email,name,dept,role").order("name");
    if (error) return;
    profiles = data || [];

const SWIPE = 168;
function closeSwipes(){ document.querySelectorAll("#users .uitem.open").forEach(li => { li.classList.remove("open"); li.querySelector(".ufront").style.transform = ""; }); }
function openSwipe(uid){ const li = document.querySelector(`#users .uitem[data-uid="${CSS.escape(uid)}"]`); if (!li) return; li.classList.add("open"); li.querySelector(".ufront").style.transform = `translateX(${-SWIPE}px)`; }
let sw = null;
$("#users").addEventListener("pointerdown", e => {
  const li = e.target.closest(".uitem"); if (!li || e.target.closest(".uact")) return;
  sw = {li, x: e.clientX, y: e.clientY, base: li.classList.contains("open") ? -SWIPE : 0, dx: 0, lock: null};
});
$("#users").addEventListener("pointermove", e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (sw.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (sw.lock !== "x") return;
  sw.dx = dx; sw.li._moved = true;
  const v = Math.max(-SWIPE, Math.min(0, sw.base + dx));
  const f = sw.li.querySelector(".ufront"); f.style.transition = "none"; f.style.transform = `translateX(${v}px)`;
});
const swipeEnd = () => {
  if (!sw) return;
  const f = sw.li.querySelector(".ufront"); f.style.transition = "";
  if (sw.lock === "x"){ const open = sw.base + sw.dx < -SWIPE / 2; const uid = sw.li.dataset.uid; closeSwipes(); if (open) openSwipe(uid); else if (userDelArmed){ userDelArmed = null; renderUsers(); } }
  sw = null;
};
$("#users").addEventListener("pointerup", swipeEnd);

let dupOk = "";   // kullanıcının "Yine de kaydet" dediği yer|departman|kategori
// Açık benzer işler: veritabanı fonksiyonu (başka departmanların açtığı işleri de bulur); yoksa görülebilen işler.
async function findDupes(room, dept, cat){
  try {
    const {data, error} = await sb.rpc("fdos_open_dupes", {p_room: room, p_dept: dept, p_cat: cat});
    if (!error && Array.isArray(data)) return data.map(r => ({by: r.created_by, at: Number(r.created_at), status: r.status}));
  } catch(e){}
  return [...tasks.values()].filter(t => isOpen(t) && t.room === room && t.dept === dept && t.cat === cat)
    .sort((a, b) => b.createdAt - a.createdAt).map(t => ({by: t.createdBy, at: t.createdAt, status: t.status}));
}

["#fDept", "#fType", "#fArea", "#fRoom", "#fCat"].forEach(id => $(id).addEventListener("input", () => {

$("#newForm").addEventListener("submit", async e => {
  e.preventDefault();
  const dept = $("#fDept").value, type = $("#fType").value, area = $("#fArea").value, cat = $("#fCat").value;

  const room = DEPTS[dept]?.noArea ? "" : area === "oda" ? roomNo : area === FLOOR_AREA && roomNo ? floorRoom(roomNo) : area;
  if ($("#fItem").value.trim()) addDraftItem();
  const err = !dept ? tx("e.dept") : !type ? tx("e.type") : !area && !DEPTS[dept]?.noArea ? tx("e.area")
    : area === "oda" && !roomNo ? tx("e.room") : area === FLOOR_AREA && !roomNo && !DEPTS[dept]?.noArea ? tx("e.floor") : !cat ? tx("e.cat") : "";
  if (err){ $("#fErr").textContent = err; $("#fErr").hidden = false; return; }
  if (!guard()) return;
  // Aynı yer, departman ve kategori için açık iş varsa önce uyar; aynı seçimle ikinci basışta kaydet.
  const dupKey = [room, dept, cat].join("|");
  if (!editId && room && dupOk !== dupKey){
    $("#fSubmit").disabled = true;
    const d = await findDupes(room, dept, cat);
    $("#fSubmit").disabled = false;
    if (d.length){
      const x = d[0], more = d.length > 1 ? tx("dup.more", {n: d.length}) : "";
      $("#fDup").innerHTML = `<b>${esc(tx("dup.head", {place: placeOf(room), dept: dL(dept), cat: cL(cat), more}))}</b><br>`
        + `${esc(anonL(x.by))} · ${esc(fmt(x.at))} · ${esc(stL(x.status))}<br>${esc(tx("dup.tail"))}`;
      $("#fDup").hidden = false; $("#fErr").hidden = true;
      $("#fSubmit").textContent = tx("f.saveAnyway"); dupOk = dupKey;
      $("#fDup").scrollIntoView({block: "nearest", behavior: "smooth"});
      return;
    }
  }
  const now = Date.now();
  if (editId){
    const t = tasks.get(editId); if (!t){ closeOv("#ovNew"); return; }
    const items = draftItems.map(x => { const o = (t.items || []).find(y => y.id === x.id); return o && !!o.done === !!x.done ? x : {...x, by: x.done ? who() : null, at: x.done ? now : null}; });
    const next = {type, cat, dept, room, desc: $("#fDesc").value.trim().slice(0, 1000), ooo: $("#fOoo").checked, guest: $("#fGuest").checked, items};
    const names = {type: "tür", cat: "kategori", dept: "departman", room: "alan/oda", desc: "açıklama", ooo: "satışa kapalı", guest: "misafir odada", items: "liste", status: "durum"};
    const cur = {...t, ooo: !!t.ooo, guest: !!t.guest, items: t.items || [], desc: t.desc || "", room: t.room || ""};
    const f = {}; Object.keys(next).forEach(k => { if (JSON.stringify(next[k]) !== JSON.stringify(cur[k])) f[k] = next[k]; });
    if ("room" in f && t.status === "dnd" && !isRoomNo(room)) f.status = "yeni";   // "DND Kartlı" yalnızca odada geçerli
    if (!Object.keys(f).length){ closeOv("#ovNew"); toast(tx("t.noChange")); return; }
    if (t.status === "tamam" && items.some(x => !x.done)){ $("#fErr").textContent = tx("e.doneItems"); $("#fErr").hidden = false; return; }
    closeOv("#ovNew"); editId = null;
    patch(t.id, f, "Güncelledi: " + Object.keys(f).map(k => names[k]).join(", "));
    toast(tx("t.updated")); return;
  }
  const doc = {
    type, cat, dept, room,
    desc: $("#fDesc").value.trim().slice(0, 1000), ooo: $("#fOoo").checked, guest: $("#fGuest").checked,
    items: draftItems.map(x => x.done ? {...x, by: who(), at: now} : {...x}),
    status: "yeni", createdAt: now, updatedAt: now, doneAt: null, verified: false, verifiedBy: null,
    createdBy: me ? me.name : "İsimsiz", createdDept: me ? me.dept : null, createdUid: authUser?.id || null,
    log: [{t: now, by: who(), msg: "İşi açtı" + (draftItems.length ? ` (${draftItems.length} kalemlik liste)` : "")}]
  };
  $("#fSubmit").disabled = true;
  try { await insertTask(doc); closeOv("#ovNew"); toast(tx("t.saved", {x: `${dL(dept)} · ${room ? placeOf(room) : tL(type)}`})); }
  catch(e2){ $("#fSubmit").disabled = false; writeError(e2); }
});

/* ---------- live data (Supabase) ---------- */
const TABLE = "fdos_tasks", DONE_DAYS = 30;
let sb = null, channel = null, signedIn = false, setupMissing = false, fetching = null;
const whereOf = d => d.room ? placeOf(d.room) : tL(d.type);
// Yer adı (ekranda): oda no → "Oda 204", koridor → "Koridor Kat 3", alan → çevrilmiş ad. Kayıtta her zaman Türkçe kalır.
const placeOf = room => { const r = String(room || ""); if (!r) return ""; if (isRoomNo(r)) return tx("pl.roomN", {r}); const fl = floorOf(r); return fl ? tx("pl.hallN", {n: fl}) : aL(r); };
// Geçmiş kaydı: veritabanında Türkçe; seçilen dilde gösterilir. Tanınmayan kayıt olduğu gibi kalır.
const LOG_FIXED = {"İşi açtı": "g.opened", "Tamamlandı olarak işaretledi": "g.done", "Kontrol etti": "g.checked", "Kontrol etti, oda satışa açıldı": "g.checkedOpen", "Yeniden açtı": "g.reopened", "Yeniden açtı, liste onayları kaldırıldı": "g.reopenedList"};
function logL(m){
  const s = String(m || ""); if (!LI()) return s;
  let x;
  if (LOG_FIXED[s]) return tx(LOG_FIXED[s]);
  if ((x = s.match(/^İşi açtı \((\d+) kalemlik liste\)$/))) return tx("g.openedList", {n: x[1]});
  if ((x = s.match(/^Durumu “(.+)” yaptı$/))){ const k = Object.keys(ST_TX).find(k => ST_TX[k][0] === x[1]); return tx("g.status", {s: k ? stL(k) : x[1]}); }
  if ((x = s.match(/^Onayladı: ([\s\S]*)$/))) return tx("g.tick", {x: x[1]});
  if ((x = s.match(/^Onayı kaldırdı: ([\s\S]*)$/))) return tx("g.untick", {x: x[1]});
  if ((x = s.match(/^Güncelledi: (.+)$/))) return tx("g.updated", {x: x[1].split(", ").map(f => TX["fld." + f] ? tx("fld." + f) : f).join(", ")});
  return s;
}
// "Ad (Departman)" biçimindeki kişi adında departmanı seçilen dile çevirir
function byL(b){
  const s = String(b || ""); if (!LI()) return s;
  const m = s.match(/^(.*) \(([^()]+)\)$/); if (!m) return anonL(s);
  if (m[2] === "Departmansız") return `${m[1]} (${tx("g.noDept")})`;
  const k = Object.keys(DEPTS).find(k => DEPTS[k].label === m[2]) || Object.keys(DATA_TX.dept).find(k => DATA_TX.dept[k][0] === m[2]);
  return k ? `${m[1]} (${dL(k)})` : s;
}
const sinceMs = () => Date.now() - DONE_DAYS * 86400000;
const newUuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : newId() + newId();
const keepRow = d => isOpen(d) || (d.doneAt && d.doneAt >= sinceMs());
function alertBuzz(){ beep(); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch(e){} }
function notify(prev, d){
  if (!me) return;
  const label = `${whereOf(d)} · ${cL(d.cat)}`;
  if (!prev){
    if (!isOpen(d) || myCreated.has(d.id)) return;
    fresh.add(d.id); setTimeout(() => fresh.delete(d.id), 3000);
    if (d.dept === me.dept){ toast(tx((d.log || []).length > 1 ? "n.reopened" : "n.new", {x: label})); alertBuzz(); }
    return;
  }
  if (isOpen(prev) && !isOpen(d) && d.createdBy === me.name){ toast(tx("n.doneMine", {x: whereOf(d)})); beep(); return; }
  if (!isOpen(prev) && isOpen(d) && d.dept === me.dept){ toast(tx("n.reopened", {x: label})); alertBuzz(); return; }
  if (isOpen(d) && prev.dept !== d.dept && d.dept === me.dept){ toast(tx("n.moved", {x: label})); beep(); }
}
function applyRow(row, silent){
  if (!row || !row.id || !row.data) return;
  const d = {id: row.id, ...row.data}, prev = tasks.get(d.id);
  if (!silent) notify(prev, d);
  if (keepRow(d)) tasks.set(d.id, d); else tasks.delete(d.id);
  renderAll(); saveSnap();
}
function listenErr(e){
  const c = (e && e.code) || "", m = (e && e.message) || "";
  if (c === "42P01" || c === "PGRST205" || /does not exist|could not find the table/i.test(m)) banner(tx("b.noTable"));
  else if (c === "42501" || /permission denied/i.test(m)) banner(tx("b.noPerm"));
  else banner(tx("b.noServer"));
  loaded = true; renderAll();
}
function refetch(){
  if (!sb || !signedIn) return Promise.resolve();
  if (fetching) return fetching;
  fetching = (async () => {
    try {
      const [a, b] = await Promise.all([
        sb.from(TABLE).select("id,data").in("status", ["yeni", "beklemede", "dnd"]).limit(1000),
        sb.from(TABLE).select("id,data").gte("done_at", sinceMs()).order("done_at", {ascending: false}).limit(1000)
      ]);
      const err = a.error || b.error;
      if (err){ listenErr(err); return; }
      tasks = new Map([...(b.data || []), ...(a.data || [])].map(r => [r.id, {id: r.id, ...r.data}]));
      loaded = true; banner(""); renderAll(); saveSnap(); loadLists(); loadProfiles();
    } catch(e){ listenErr(e); }
  })().finally(() => { fetching = null; });
  return fetching;
}
function startLive(){
  stopLive();
  channel = sb.channel("fdos-tasks")
    .on("postgres_changes", {event: "*", schema: "public", table: TABLE}, p => {
      if (p.eventType === "DELETE"){ const id = p.old && p.old.id; if (id && tasks.has(id)){ tasks.delete(id); renderAll(); saveSnap(); } }
      else applyRow(p.new);
    })
    .subscribe(status => {
      if (status === "SUBSCRIBED") refetch();
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") banner(tx("b.live"));
    });
  refetch();
}
function stopLive(){ if (channel && sb){ try { sb.removeChannel(channel); } catch(e){} } channel = null; }
// Telefonda uygulama arka plandan yeniden açılınca Anasayfa'ya dön (birkaç saniyelik kısa geçişler hariç).
// Yazılmakta olan bir form (iş ya da kullanıcı) açıksa dokunulmaz.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ hiddenAt = Date.now(); return; }
  refetch();
  if (hiddenAt && Date.now() - hiddenAt > 10000 && $("#ovNew").hidden && $("#ovUsers").hidden){
    ["#ovDetail", "#ovFilter", "#ovWho"].forEach(id => { if (!$(id).hidden) closeOv(id); });
    ui.tab = "ana"; window.scrollTo(0, 0); renderAll();
  }
  hiddenAt = 0;
});
addEventListener("online", () => refetch());
// Telefonda canlı bağlantı sessizce kopabilir; ekran açıkken 5 dakikada bir liste tazelenir.
setInterval(() => { if (document.visibilityState === "visible") refetch(); }, 5 * 60000);

/* ---------- writes (Supabase) ---------- */
function writeError(e){
  const c = (e && e.code) || "", m = (e && e.message) || "";
  if (c === "42501" || /row-level security|permission denied/i.test(m)) toast(tx("x.noPerm"));
  else if (e && e.status === 401 || /jwt|session/i.test(m)){ toast(tx("x.session")); openLogin(); }
  else if (/fetch|network|load failed/i.test(m)) toast(tx("x.offline"));
  else toast(tx("e.saveFail", {m: m || tx("err.unknown")}));
}
function guard(){
  if (sb && !signedIn && !authReady){ toast(tx("x.connecting")); return false; }
  if (!sb || !signedIn){ openLogin(); return false; }
  return true;
}
async function patch(id, fields, msg){
  if (!guard()) return;
  const t = tasks.get(id); if (!t) return;
  const log = [...(t.log || []), {t: Date.now(), by: who(), msg}].slice(-40);
  const body = JSON.parse(JSON.stringify({...fields, updatedAt: Date.now(), log}));
  const {id: _drop, ...rest} = {...t, ...body};
  applyRow({id, data: rest}, true);
  try {
    const {data, error} = await sb.rpc("fdos_patch_task", {p_id: id, p_patch: body});
    if (error){ writeError(error); refetch(); }
    else if (data === false){ toast(tx("x.gone")); refetch(); }
  } catch(e){ writeError(e); refetch(); }
}
async function remove(id){
  if (!guard()) return;
  tasks.delete(id); closeOv("#ovDetail"); renderAll(); saveSnap();
  try {
    const {data, error} = await sb.from(TABLE).delete().eq("id", id).select("id");
    if (error){ writeError(error); refetch(); }
    else if (!data || !data.length){ toast(tx("x.delNoPerm")); refetch(); }
    else toast(tx("x.deleted"));
  } catch(e){ writeError(e); refetch(); }
}
async function insertTask(doc){
  const id = newUuid(); myCreated.add(id);
  const {error} = await sb.from(TABLE).insert({id, data: doc});
  if (error) throw error;
  applyRow({id, data: doc}, true);
}

/* ---------- login ---------- */
function authMsg(m){
  m = m || "";
  if (/invalid login credentials|invalid_credentials/i.test(m)) return tx("a.wrong");
  if (/email not confirmed/i.test(m)) return tx("a.notConfirmed");
  if (/rate limit|too many/i.test(m)) return tx("a.rate");
  if (/at least|weak|short/i.test(m)) return tx("a.short");
  if (/fetch|network|load failed/i.test(m)) return tx("net.none");
  return tx("a.fail", {m});
}
function loginMsg(text, ok){ const el = $("#lErr"); el.textContent = text; el.classList.toggle("ok", !!ok); el.hidden = !text; }
function openLogin(){ loginMsg(""); $("#lSubmit").disabled = false; openOv("#ovLogin"); }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const em = $("#lEmail").value.trim(), pw = $("#lPass").value;
  if (!em || !pw){ loginMsg(tx("l.fill")); return; }
  $("#lSubmit").disabled = true; loginMsg("");
  try {
    const {error} = await sb.auth.signInWithPassword({email: em, password: pw});
    if (error) loginMsg(authMsg(error.message)); else $("#lPass").value = "";
  } catch(err){ loginMsg(authMsg(err && err.message)); }
  finally { $("#lSubmit").disabled = false; }
});
$("#lReset").addEventListener("click", async () => {
  const em = $("#lEmail").value.trim();
  if (!em){ loginMsg(tx("l.emailFirst")); return; }
  try {
    const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
    if (error) loginMsg(authMsg(error.message)); else loginMsg(tx("l.resetSent"), true);
  } catch(err){ loginMsg(authMsg(err && err.message)); }
});
$("#logoutBtn").addEventListener("click", () => { closeOv("#ovWho"); if (sb) sb.auth.signOut(); });
function openNewPass(){ $("#pErr").hidden = true; $("#pNew").value = ""; $("#pNew2").value = ""; openOv("#ovPass"); }
$("#passForm").addEventListener("submit", async e => {
  e.preventDefault();
  const a = $("#pNew").value, b = $("#pNew2").value, err = $("#pErr");
  if (a.length < 6){ err.textContent = tx("a.short"); err.hidden = false; return; }
  if (a !== b){ err.textContent = tx("p.mismatch"); err.hidden = false; return; }
  const {error} = await sb.auth.updateUser({password: a});
  if (error){ err.textContent = authMsg(error.message); err.hidden = false; return; }
  closeOv("#ovPass"); toast(tx("p.changed"));
});

/* ---------- dil ---------- */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = tx(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = tx(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", tx(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = tx(el.dataset.i18nTitle));
}
// Dil kişiye bağlıdır: veritabanında fdos_profiles.lang (fdos_set_lang ile), ayrıca bu cihazda saklanır.
function setLang(l, remote){
  if (!LANGS.includes(l)) return;
  const changed = l !== LANG; LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  if (remote && sb && signedIn) sb.rpc("fdos_set_lang", {p_lang: l}).then(() => {}, () => {});
  if (!changed) return;
  applyStatic(); renderAll();
  if (!$("#ovWho").hidden) openWho();
  if (!$("#ovUsers").hidden) renderUsers();
}
let langSynced = false;
function syncLang(){
  if (langSynced || !sb || !signedIn || !authUser) return;
  langSynced = true;
  sb.from("fdos_profiles").select("lang").eq("user_id", authUser.id).maybeSingle()
    .then(({data, error}) => { if (!error && data && LANGS.includes(data.lang)) setLang(data.lang, false); }, () => {});
}

/* ---------- start ---------- */
// Açılışı hızlandırmak için son görülen işler, profil ve listeler cihazda saklanır.
// Uygulama açılınca önce bunlar gösterilir, sunucudan gelen güncel veri hemen ardından yerine geçer.
// Oturum kapanınca ya da başka hesapla girilince silinir.
const SNAP = "fdos.snap";
let authReady = false, snapTimer = null;
function saveSnap(){
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    if (!signedIn || !me || !loaded || !authUser) return;
    const snap = {v: 1, uid: authUser.id, email: authUser.email || "", me, depts: DEPTS, types: TYPES, areas: AREAS, tasks: [...tasks.values()]};
    try { localStorage.setItem(SNAP, JSON.stringify(snap)); }
    catch(e){
      // yer yetmezse geçmiş kayıtları olmadan dene
      try { snap.tasks = snap.tasks.map(t => ({...t, log: []})); localStorage.setItem(SNAP, JSON.stringify(snap)); }
      catch(e2){ dropSnap(); }
    }
  }, 400);
}
function dropSnap(){ clearTimeout(snapTimer); try { localStorage.removeItem(SNAP); } catch(e){} }
function loadSnap(){
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(SNAP) || "null"); } catch(e){}
  if (!snap || snap.v !== 1 || !snap.uid || !snap.me || !Array.isArray(snap.tasks)) return;
  const fill = (dst, src) => { if (src && Object.keys(src).length){ Object.keys(dst).forEach(k => delete dst[k]); Object.assign(dst, src); } };
  fill(DEPTS, snap.depts); fill(TYPES, snap.types);
  if (Array.isArray(snap.areas) && snap.areas.length){ AREAS.length = 0; AREAS.push(...snap.areas); }
  authUser = {id: snap.uid, email: snap.email}; me = snap.me;
  tasks = new Map(snap.tasks.map(t => [t.id, t])); loaded = true;
}
function onSession(session){
  authReady = true;
  if (session && authUser && authUser.id !== session.user.id && !signedIn){ tasks = new Map(); me = null; loaded = false; dropSnap(); }
  const was = signedIn; signedIn = !!session; authUser = session ? session.user : null;
  if (signedIn){
    closeOv("#ovLogin"); $("#logoutBtn").hidden = false;
    if (!was){ ui.tab = "ana"; window.scrollTo(0, 0); renderAll(); startLive(); loadLists(); loadProfiles(); }
  } else {
    stopLive(); tasks = new Map(); loaded = false; langSynced = false; $("#logoutBtn").hidden = true;
    profiles = []; me = null; dropSnap();
    closeOv("#ovUsers"); renderAll(); openLogin();
  }
}
function boot(){
  const cfg = window.FDOS_SUPABASE;
  if (!window.supabase || !cfg || !cfg.url || !cfg.anonKey || /BURAYA|PROJE-ID/.test(cfg.url + cfg.anonKey)){
    setupMissing = true; dbFailed = true; loaded = true; renderAll(); return;
  }
  loadSnap(); renderAll();
  sb = window.supabase.createClient(cfg.url, cfg.anonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY"){ onSession(session); try { history.replaceState(null, "", location.pathname); } catch(e){} openNewPass(); return; }
      if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") onSession(session);
    }, 0);
  });
}
applyStatic(); renderAll();
setInterval(() => { if (!$("#q") || document.activeElement?.id !== "q") renderScreen(); }, 60000);
boot();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
